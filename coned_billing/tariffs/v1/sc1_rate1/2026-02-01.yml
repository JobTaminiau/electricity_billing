# Tariff schema v1. Transcribed from the cited leaves; see docs/dev/transcription_review.md.
# verification_status 'owner_verified' may only be set through verification_record.yml.
schema_version: 1
tariff_id: sc1_rate1
version: '2026-02-01'
utility: Consolidated Edison Company of New York, Inc.
jurisdiction: New York State Public Service Commission
tariff_book: PSC No. 10 - Electricity
service_classification: SC-1
rate_option: Rate I - Residential and Religious
voltage: null
zone: null
timezone: America/New_York
effective:
  start: 2026-02-01
  end: null
valid_as_of: 2026-10-23
verification_status: transcribed
calculation_modes:
- historical
- scenario
case: 25-E-0072
sources:
- psc10-leaf-388-r23
- psc10-leaf-85-r3
- psc10-leaf-387-r6
- psc10-leaf-390-r5
eligibility: 'SC-1 Rate I applicability (leaf 388): "To all Customers other than those billed under other
  Rates." SC-1 applies to residential and religious use as set out on leaf 387.'
required_account_inputs: []
assumptions:
- Delivery charges only. Supply (GR 25), GR 26 adjustments and the GR 30 percentage increase are excluded
  and listed under excluded_components.
- 'Effective dates are dates of service: start inclusive, end exclusive. Bills spanning a rate change
  are prorated by days of service (GR 10.5.1, leaf 85); proration is applied by the billing engine (WP5).'
- The Customer Charge 'per month' is read as a monthly charge prorated by elapsed days / 30 under GR 10.5.2,
  not as a per-bill or per-calendar-month charge. Owner to confirm.
- The 250 kWh block applies to the kWh billed at summer rates in the billing period.
components:
- id: customer_charge
  name: Customer Charge
  category: fixed_charge
  determinant: billing_period
  unit: USD/month
  rate: 21.0
  window:
    excluded_holidays: none
  proration:
    rule: days_over_30
    source:
      document: psc10-leaf-85-r3
      leaf: '85'
      revision: 3
      page: 1
      text: Monthly rates and charges will be prorated when the Company renders a bill for other than
        a 30-day period on the basis of the number of elapsed days divided by 30
  source:
    document: psc10-leaf-388-r23
    leaf: '388'
    revision: 23
    page: 1
    text: $21.00 per month
- id: energy_delivery_summer
  name: Energy Delivery Charge, June-September
  category: delivery_energy
  determinant: kwh
  window:
    months: [6, 7, 8, 9]
    excluded_holidays: none
  blocks:
  - up_to: 250
    rate: 0.16402
    unit: USD/kWh
  - up_to: null
    rate: 0.18858
    unit: USD/kWh
  block_proration:
    rule: bounds_days_over_30
    source:
      document: psc10-leaf-85-r3
      leaf: '85'
      revision: 3
      page: 1
      text: usage within the first and each succeeding rate block will be prorated on the basis of the
        number of elapsed days divided by 30
  proration:
    rule: none
    source:
      document: psc10-leaf-85-r3
      leaf: '85'
      revision: 3
      page: 1
      text: rates and charges assessed per kWhr will not be prorated
  exclusive_group: energy_delivery
  source:
    document: psc10-leaf-388-r23
    leaf: '388'
    revision: 23
    page: 1
    text: first 250 kWhr $0.16402 per kWhr over 250 kWhr $0.18858 per kWhr
- id: energy_delivery_other
  name: Energy Delivery Charge, all other months
  category: delivery_energy
  determinant: kwh
  unit: USD/kWh
  rate: 0.16402
  window:
    months: [1, 2, 3, 4, 5, 10, 11, 12]
    excluded_holidays: none
  proration:
    rule: none
    source:
      document: psc10-leaf-85-r3
      leaf: '85'
      revision: 3
      page: 1
      text: rates and charges assessed per kWhr will not be prorated
  exclusive_group: energy_delivery
  source:
    document: psc10-leaf-388-r23
    leaf: '388'
    revision: 23
    page: 1
    text: All kWhr $0.16402 per kWhr
excluded_components:
- id: additional_delivery_charges_gr26
  name: Additional Delivery Charges and Adjustments (General Rule 26)
