    document: psc10-leaf-397-r23
    leaf: '397'
    revision: 23
    page: 1
    text: $30.21 per month for Customers furnished with unmetered service
- id: additional_delivery_charges_gr26
  name: Additional Delivery Charges and Adjustments (General Rule 26)
