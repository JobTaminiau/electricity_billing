# Tariff schema v1. Transcribed from the cited leaves; see docs/dev/transcription_review.md.
# verification_status 'owner_verified' may only be set through verification_record.yml.
schema_version: 1
tariff_id: sc9_rate1_lt
version: '2025-01-01'
utility: Consolidated Edison Company of New York, Inc.
jurisdiction: New York State Public Service Commission
tariff_book: PSC No. 10 - Electricity
service_classification: SC-9
rate_option: Rate I - General - Large
voltage: low_tension
zone: null
timezone: America/New_York
effective:
  start: 2025-01-01
  end: 2026-02-01
verification_status: transcribed
calculation_modes:
- historical
- scenario
case: 22-E-0064
sources:
- psc10-leaf-445-r20
- psc10-leaf-85-r3
- psc10-leaf-84-r1
- psc10-leaf-90-r4
eligibility: 'SC-9 Rate I applicability (leaf 445): "To all Customers other than those billed under Rate
  II, Rate III, Rate IV, or Rate V." Low tension service.'
required_account_inputs:
- 'service voltage: low_tension'
assumptions:
- Delivery charges only. Supply (GR 25), GR 26 adjustments and the GR 30 percentage increase are excluded
  and listed under excluded_components.
- 'Effective dates are dates of service: start inclusive, end exclusive. Bills spanning a rate change
  are prorated by days of service (GR 10.5.1, leaf 85); proration is applied by the billing engine (WP5).'
- The Customer Charge 'per month' is read as a monthly charge prorated by elapsed days / 30 under GR 10.5.2,
  not as a per-bill or per-calendar-month charge. Owner to confirm.
- Maximum demand is the highest 30-minute integrated demand in the billing period (GR 10.4); WP4 derives
  it from interval data.
components:
- id: customer_charge
  name: Customer Charge
  category: fixed_charge
  determinant: billing_period
  unit: USD/month
  rate: 71.0
  window:
    excluded_holidays: none
  proration:
    rule: days_over_30
    source:
      document: psc10-leaf-85-r3
      leaf: '85'
      revision: 3
      page: 1
      text: Monthly rates and charges will be prorated when the Company renders a bill for other than
        a 30-day period on the basis of the number of elapsed days divided by 30
  source:
    document: psc10-leaf-445-r20
    leaf: '445'
    revision: 20
    page: 1
    text: $71.00 per month
- id: demand_delivery_summer
  name: Demand Delivery Charge, June-September
  category: delivery_demand
  determinant: max_demand_kw
  unit: USD/kW
  rate: 42.8
  window:
    months: [6, 7, 8, 9]
    excluded_holidays: none
  proration:
    rule: days_over_30
    source:
      document: psc10-leaf-85-r3
      leaf: '85'
      revision: 3
      page: 1
      text: Rates and charges assessed per kW will be prorated for 30 days
  demand_measurement:
    method: integrated_demand
    integration_minutes: 30
    source:
      document: psc10-leaf-84-r1
      leaf: '84'
      revision: 1
      page: 1
      text: the maximum demand shall be the highest 30-minute integrated demand occurring during the billing
        period
  source:
    document: psc10-leaf-445-r20
    leaf: '445'
    revision: 20
    page: 1
    text: $42.80 per kW $29.50 per kW
- id: demand_delivery_other
  name: Demand Delivery Charge, all other months
  category: delivery_demand
  determinant: max_demand_kw
  unit: USD/kW
  rate: 33.5
  window:
    months: [1, 2, 3, 4, 5, 10, 11, 12]
    excluded_holidays: none
  proration:
    rule: days_over_30
    source:
      document: psc10-leaf-85-r3
      leaf: '85'
      revision: 3
      page: 1
      text: Rates and charges assessed per kW will be prorated for 30 days
  demand_measurement:
    method: integrated_demand
    integration_minutes: 30
    source:
      document: psc10-leaf-84-r1
      leaf: '84'
      revision: 1
      page: 1
      text: the maximum demand shall be the highest 30-minute integrated demand occurring during the billing
        period
  source:
    document: psc10-leaf-445-r20
    leaf: '445'
    revision: 20
    page: 1
    text: $33.50 per kW $20.51 per kW
- id: energy_delivery
  name: Energy Delivery Charge
  category: delivery_energy
  determinant: kwh
  unit: cents/kWh
  rate: 1.66
  window:
    excluded_holidays: none
  proration:
    rule: none
    source:
      document: psc10-leaf-85-r3
      leaf: '85'
      revision: 3
      page: 1
      text: rates and charges assessed per kWhr will not be prorated
  exclusive_group: energy_delivery
  source:
    document: psc10-leaf-445-r20
    leaf: '445'
    revision: 20
    page: 1
    text: 1.66 cents per kWhr 1.54 cents per kWhr
excluded_components:
- id: additional_delivery_charges_gr26
  name: Additional Delivery Charges and Adjustments (General Rule 26)
  reason: Set by monthly statements (e.g. MAC, surcharges, adjustment factors) that are not transcribed;
    not modeled.
  source:
    document: psc10-leaf-445-r20
    leaf: '445'
    revision: 20
    page: 1
    text: Additional Delivery Charges and Adjustments, as specified in General Rule 26.
- id: reactive_power_demand_gr1011
  name: Reactive Power Demand Charge (General Rule 10.11)
  reason: Needs kVAr metering data, which the package does not take; not modeled.
  source:
    document: psc10-leaf-445-r20
    leaf: '445'
    revision: 20
    page: 1
    text: Reactive Power Demand Charge, applicable as specified in General Rule 10.11.
- id: minimum_monthly_charge_gr1010
  name: Minimum Monthly Charge (General Rule 10.10, Contract Demand)
  reason: Needs the account's highest registered demand in the most recent 18 months; not modeled.
  source:
    document: psc10-leaf-90-r4
    leaf: '90'
    revision: 4
    page: 1
    text: A Minimum Monthly Charge is applicable to Customers billed for demand under SCs 5, 8, 9, 12,
      and 13
- id: supply_charges_gr25
  name: 'Supply and supply-related charges (General Rule 25: Market Supply Charge, Merchant Function Charge)'
  reason: Supply is not part of this delivery tariff version; calculations must supply an explicit supply
    assumption (D5). A packaged, sourced MSC dataset is WP8.
- id: increase_in_rates_gr30
  name: Increase in Rates and Charges (General Rule 30)
  reason: Percentage increase shown on a separate statement; not transcribed, not modeled.
