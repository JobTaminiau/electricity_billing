excluded_components:
- id: additional_delivery_charges_gr26
  name: Additional Delivery Charges and Adjustments (General Rule 26)
  reason: Set by monthly statements (e.g. MAC, surcharges, adjustment factors) that are not transcribed;
    not modeled.
  source:
    document: psc10-leaf-445-r17
    leaf: '445'
    revision: 17
    page: 1
    text: Additional Delivery Charges and Adjustments, as specified in General Rule 26.
    method: page_image
- id: reactive_power_demand_gr1011
  name: Reactive Power Demand Charge (General Rule 10.11)
  reason: Needs kVAr metering data, which the package does not take; not modeled.
  source:
    document: psc10-leaf-445-r17
    leaf: '445'
    revision: 17
    page: 1
    text: Reactive Power Demand Charge, applicable as specified in General Rule 10.11.
    method: page_image
- id: minimum_monthly_charge_gr1010
  name: Minimum Monthly Charge (General Rule 10.10, Contract Demand)
  reason: Needs the account's highest registered demand in the most recent 18 months; not modeled.
  source:
    document: psc10-leaf-90-r4
    leaf: '90'
    revision: 4
    page: 1
    text: A Minimum Monthly Charge is applicable to Customers billed for demand under SCs 5, 8, 9, 12,
      and 13
- id: supply_charges_gr25
  name: 'Supply and supply-related charges (General Rule 25: Market Supply Charge, Merchant Function Charge)'
  reason: Supply is not part of this delivery tariff version; calculations must supply an explicit supply
    assumption (D5). A packaged, sourced MSC dataset is WP8.
- id: increase_in_rates_gr30
  name: Increase in Rates and Charges (General Rule 30)
  reason: Percentage increase shown on a separate statement; not transcribed, not modeled.
