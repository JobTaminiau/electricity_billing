- historical
- scenario
case: 19-E-0065
sources:
- psc10-leaf-449-r12
- psc10-leaf-85-r3
- psc10-leaf-84-r0
- psc10-leaf-90-r4
eligibility: SC-9 Rate II is mandatory for Customers whose monthly maximum demand exceeds 1,500 kW in
  any annual period ending September 30, among other criteria (leaf 447). Low tension service.
required_account_inputs:
- 'service voltage: low_tension'
assumptions:
- Delivery charges only. Supply (GR 25), GR 26 adjustments and the GR 30 percentage increase are excluded
  and listed under excluded_components.
- 'Effective dates are dates of service: start inclusive, end exclusive. Bills spanning a rate change
  are prorated by days of service (GR 10.5.1, leaf 85); proration is applied by the billing engine (WP5).'
- The Customer Charge 'per month' is read as a monthly charge prorated by elapsed days / 30 under GR 10.5.2,
  not as a per-bill or per-calendar-month charge. Owner to confirm.
- Maximum demand for each time period is the highest 30-minute integrated demand in that period (GR 10.4);
  WP4 derives it from interval data.
- 'The time periods are stated ''Monday through Friday'' with no holiday wording (leaf 449), and GR 10.10
  (leaf 90) describes off-peak hours as the 48 hours of Saturday and Sunday plus 10 PM-8 AM weekdays,
  so holidays are not excluded (owner decision 2026-10-23: follow the leaf).'
- 'The demand charges for the time periods are additive: ''The total demand charge will be the sum of
  the charges for each of the time periods.'''
