  name: Minimum Monthly Charge (General Rule 10.10, Contract Demand)
  reason: Needs the account's highest registered demand in the most recent 18 months; not modeled.
  source:
    document: psc10-leaf-90-r4
    leaf: '90'
    revision: 4
    page: 1
    text: A Minimum Monthly Charge is applicable to Customers billed for demand under SCs 5, 8, 9, 12,
      and 13
